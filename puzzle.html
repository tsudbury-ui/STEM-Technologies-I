<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6th Grade CS - Internet Terms Slide Puzzle</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        p.subtitle {
            margin-top: 0;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .stats-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 8px;
            background-color: #34495e;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #3498db;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }

        .tile:hover {
            background-color: #2980b9;
        }

        .tile.empty {
            background-color: #2c3e50;
            cursor: default;
            box-shadow: none;
        }

        .tile-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        button {
            margin-top: 20px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: #2ecc71;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #27ae60;
        }

        #win-message {
            margin-top: 15px;
            font-size: 1.3rem;
            color: #27ae60;
            font-weight: bold;
            height: 30px;
        }
    </style>
</head>
<body>

    <h1>🌐 Web Connect Puzzle</h1>
    <p class="subtitle">6th Grade Computer Science</p>

    <div class="stats-container">
        <div>Moves: <span id="move-count">0</span></div>
    </div>

    <div id="puzzle-board"></div>

    <div id="win-message"></div>

    <button onclick="resetPuzzle()">Shuffle / Reset</button>

    <script>
        // Define puzzle pieces with labels and emojis
        const solvedState = [
            { id: 1, label: "Browser", icon: "🌐" },
            { id: 2, label: "URL", icon: "🔗" },
            { id: 3, label: "IP Address", icon: "🔢" },
            { id: 4, label: "Server", icon: "🖥️" },
            { id: 5, label: "Bandwidth", icon: "⚡" },
            { id: 6, label: "Search Engine", icon: "🔍" },
            { id: 7, label: "Internet", icon: "☁️" },
            { id: 8, label: "Router", icon: "📡" },
            { id: 0, label: "", icon: "" } // Empty slot
        ];

        let currentState = [...solvedState];
        let moves = 0;

        const board = document.getElementById('puzzle-board');
        const moveDisplay = document.getElementById('move-count');
        const winMessage = document.getElementById('win-message');

        function renderBoard() {
            board.innerHTML = '';
            currentState.forEach((tile, index) => {
                const tileDiv = document.createElement('div');
                tileDiv.classList.add('tile');
                
                if (tile.id === 0) {
                    tileDiv.classList.add('empty');
                } else {
                    tileDiv.innerHTML = `<span class="tile-icon">${tile.icon}</span><span>${tile.label}</span>`;
                    tileDiv.addEventListener('click', () => makeMove(index));
                }
                
                board.appendChild(tileDiv);
            });
        }

        function makeMove(index) {
            const emptyIndex = currentState.findIndex(tile => tile.id === 0);
            
            // Check valid adjacent moves (row/col check)
            const validMoves = getValidMoves(emptyIndex);
            
            if (validMoves.includes(index)) {
                // Swap clicked tile with empty space
                [currentState[index], currentState[emptyIndex]] = [currentState[emptyIndex], currentState[index]];
                moves++;
                moveDisplay.textContent = moves;
                renderBoard();
                checkWin();
            }
        }

        function getValidMoves(emptyIdx) {
            const row = Math.floor(emptyIdx / 3);
            const col = emptyIdx % 3;
            const valid = [];

            if (row > 0) valid.push(emptyIdx - 3); // Up
            if (row < 2) valid.push(emptyIdx + 3); // Down
            if (col > 0) valid.push(emptyIdx - 1); // Left
            if (col < 2) valid.push(emptyIdx + 1); // Right

            return valid;
        }

        function shuffle() {
            // Perform random valid moves from solved state to guarantee solvability
            for (let i = 0; i < 100; i++) {
                const emptyIdx = currentState.findIndex(tile => tile.id === 0);
                const validMoves = getValidMoves(emptyIdx);
                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                [currentState[randomMove], currentState[emptyIdx]] = [currentState[emptyIdx], currentState[randomMove]];
            }
        }

        function checkWin() {
            const isSolved = currentState.every((tile, index) => tile.id === solvedState[index].id);
            if (isSolved && moves > 0) {
                winMessage.textContent = "🎉 Great job! Puzzle Solved!";
            }
        }

        function resetPuzzle() {
            moves = 0;
            moveDisplay.textContent = moves;
            winMessage.textContent = '';
            shuffle();
            renderBoard();
        }

        // Initialize game
        resetPuzzle();
    </script>
</body>
</html>
